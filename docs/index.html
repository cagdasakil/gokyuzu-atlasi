<style>
/* Layout: full-screen planetarium; thin top bar (place / time / search), tool rail at the bottom, sheets rise from the bottom on phones and dock right on desktop. Single dark "observatory at night" theme by design. */
:root {
  --night: #04060c;

  --f-ui: "Manrope", "Helvetica Neue", Arial, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--f-ui); font-size: 14px; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; }
#cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.campill { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(max(12px, env(safe-area-inset-bottom, 0px)) + 96px); }
.campill.on { border-color: var(--gilt); color: var(--gilt); }
.ar .chips, .ar .hud { display: none !important; }
#gl, #tr, #ov { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#tr { pointer-events: none; }
#ov { touch-action: none; cursor: grab; }
#red { position: absolute; inset: 0; background: #ff2a14; mix-blend-mode: multiply; pointer-events: none; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--gilt); outline-offset: 2px; }

.bar {
  position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px;
  padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-bottom: 10px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to bottom, rgba(4,6,12,.85), rgba(4,6,12,0));
  pointer-events: none;
}
.bar > * { pointer-events: auto; }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 13px; border-radius: 18px; border: 1px solid var(--line); background: rgba(10,13,24,.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); cursor: pointer; white-space: nowrap; font-size: 13px; }
.pill svg { flex: none; opacity: .8; }
.pill .t { font-family: var(--f-num); font-size: 12.5px; letter-spacing: .02em; }
.grow { flex: 1; }
.iconbtn { width: 36px; padding: 0; justify-content: center; }

.chips { position: absolute; left: 0; right: 0; top: calc(max(10px, env(safe-area-inset-top, 0px)) + 46px); display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 28px; padding: 0 11px; border-radius: 14px; border: 1px solid var(--line); background: rgba(10,13,24,.5); font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 7px; height: 7px; border-radius: 50%; }
.chips .lead { flex: none; font-size: 11px; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; align-self: center; margin-right: 2px; }

.rail {
  position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 0; flex-wrap: wrap;
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); padding-top: 24px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));

  pointer-events: none;
}
.tool { pointer-events: auto; width: 50px; display: grid; justify-items: center; gap: 4px; padding: 6px 0; border: 0; background: none; cursor: pointer; color: var(--dim); font-size: 9.5px; letter-spacing: 0; border-radius: 10px; white-space: nowrap; }
.tool svg { width: 22px; height: 22px; }
.tool[aria-pressed="true"] { color: var(--gilt); }
.tool:hover { color: var(--ink); }
.tool[aria-pressed="true"]:hover { color: var(--gilt); }

.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 72%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--panel); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);

  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  transform: translateY(0); transition: transform .28s cubic-bezier(.2,.8,.2,1);
  -webkit-user-select: text; user-select: text;

.sheet.closed { transform: translateY(105%); pointer-events: none; }
.grab { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 2px auto 10px; }
.shead { display: flex; align-items: flex-start; gap: 12px; }
.shead .grow { min-width: 0; }
.x { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: none; cursor: pointer; display: grid; place-items: center; }
.kind { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gilt); }

.rows { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1px; margin-top: 14px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.row { background: rgba(10,13,24,.92); padding: 10px 12px; min-width: 0; }

.warn { margin-top: 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(227,194,126,.35); color: var(--gilt); font-size: 13px; }

.field { display: grid; gap: 6px; margin-top: 12px; }
.field label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
input[type="search"], input[type="datetime-local"], input[type="range"] { width: 100%; box-sizing: border-box; }
input[type="search"], input[type="datetime-local"] { height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--ink); font: inherit; font-size: 15px; }

.btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.btn { height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.04); cursor: pointer; font-size: 13px; }
.btn.on { border-color: var(--gilt); color: var(--gilt); }
.list { margin-top: 10px; display: grid; }
.itemrow { display: flex; align-items: stretch; } .itemrow .item { flex: 1; min-width: 0; }
.cal { flex: none; width: 44px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--gilt); cursor: pointer; font-size: 15px; }
.item { display: flex; align-items: baseline; gap: 10px; padding: 11px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; width: 100%; }
.item b { font-weight: 500; font-size: 15px; }
.item span { color: var(--dim); font-size: 12px; margin-left: auto; white-space: nowrap; }
.item:hover b { color: var(--gilt); }
.sect { margin-top: 18px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gilt); }
.set { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; margin-top: 12px; }
.set label { font-size: 13.5px; }
.set output { font-family: var(--f-num); font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.set input { grid-column: 1 / -1; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; margin-top: 8px; }
.seg .btn { padding: 0 6px; }
.note { margin-top: 10px; font-size: 12px; color: var(--dim); line-height: 1.5; }
.toast { position: absolute; left: 50%; top: calc(max(10px, env(safe-area-inset-top, 0px)) + 86px); transform: translateX(-50%); padding: 8px 14px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; transition: opacity .3s; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
.toast.hide { opacity: 0; pointer-events: none; }
.intro { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; animation: introOut 1.4s ease 3s forwards; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.intro .it { font-family: var(--f-name); font-style: italic; font-weight: 500; font-size: clamp(46px, 11vw, 96px); line-height: 1; text-shadow: 0 0 40px rgba(169,198,255,.45), 0 0 2px rgba(255,255,255,.4); animation: introIn 1.8s cubic-bezier(.2,.7,.2,1) both; }
.intro .is { margin-top: 14px; font-size: 11.5px; letter-spacing: .32em; text-transform: uppercase; color: var(--gilt); animation: introIn 1.8s ease .5s both; }
@keyframes introIn { from { opacity: 0; transform: translateY(10px) scale(.98); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes introOut { to { opacity: 0; visibility: hidden; } }
.bar, .rail, .chips { animation: uiIn 1s ease 3.2s both; }

.tourcard { position: absolute; left: 50%; transform: translateX(-50%); top: calc(max(10px, env(safe-area-inset-top, 0px)) + 88px); width: min(420px, calc(100% - 32px)); box-sizing: border-box; padding: 14px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); animation: uiIn .5s ease both; }

.hubbtn { color: var(--gilt); border-color: rgba(227,194,126,.45); }

.hub { display: grid; gap: 3px; text-align: left; padding: 14px 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.03); cursor: pointer; min-width: 0; }

.tb2 { margin-top: 8px; display: flex; justify-content: flex-end; }
.bcard { width: 100%; height: auto; margin-top: 14px; border-radius: 12px; border: 1px solid var(--line); display: block; }
.sel { height: 42px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--ink); font: inherit; font-size: 15px; width: 100%; }
.onb { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(2,4,10,.55); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); animation: uiIn .4s ease both; }
.onbc { width: min(360px, 100%); box-sizing: border-box; padding: 22px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); text-align: center; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }

@media (max-width: 420px) { .hubbtn span { display: none; } .hubbtn { width: 36px; padding: 0; justify-content: center; } }

  <div id="red" hidden></div>

/* ---------------- vector helpers ---------------- */
const nrm3 = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/l, v[1]/l, v[2]/l]; };
const crs3 = (a, b) => [a[1]*b[2] - a[2]*b[1], a[2]*b[0] - a[0]*b[2], a[0]*b[1] - a[1]*b[0]];
const comb = (a, ka, b, kb) => [a[0]*ka + b[0]*kb, a[1]*ka + b[1]*kb, a[2]*ka + b[2]*kb];

/* ---------------- meteor showers & shooting stars ---------------- */
const SHOWERS = [
  ['Quadrantids', 1, 3, 230, 49, 110, T('Boötes ile Draco arasından'), T('Kaynağı 2003 EH1 adlı söner bir kuyruklu yıldız ya da asteroit.')],
  ['Lyrids', 4, 22, 271, 34, 18, T('Lyra yönünden'), T('Thatcher kuyruklu yıldızının tozları; 2.700 yıldır kayıtlarda geçiyor.')],
  ['Eta Aquariids', 5, 6, 338, -1, 50, T('Aquarius yönünden'), T('Halley kuyruklu yıldızının bıraktığı tozlar.')],
  ['Perseids', 8, 12, 48, 58, 100, T('Perseus yönünden'), T('Yılın en sevilen yağmuru; Swift–Tuttle kuyruklu yıldızının tozları.')],
  ['Draconids', 10, 8, 262, 54, 10, T('Draco yönünden'), T('Giacobini–Zinner kuyruklu yıldızından gelir; bazı yıllar ani patlamalar yapar.')],
  ['Orionids', 10, 21, 95, 16, 20, T('Orion\'un omzunun yakınından'), T('Halley kuyruklu yıldızının tozları; meteorlar saniyede 66 km hızla atmosfere girer.')],
  ['Leonids', 11, 17, 152, 22, 15, T('Leo yönünden'), T('Tempel–Tuttle kuyruklu yıldızının tozları; 1833 ve 1966\'da saatte binlerce meteor görüldü.')],
  ['Geminids', 12, 14, 112, 33, 150, T('Gemini yönünden'), T('En yoğun yağmurlardan; kaynağı bir kuyruklu yıldız değil, 3200 Phaethon asteroidi.')],
  ['Ursids', 12, 22, 217, 76, 10, T('Ursa Minor yönünden'), T('Tuttle kuyruklu yıldızının tozları; kış gündönümü civarında.')]
].map(([n, m, d, ra, dec, zhr, from, fact]) => ({ n, m, d, v: eqv(ra, dec), zhr, from, fact }));
function showerAct(sh, date) {
  let best = 1e9, peak = null;
  for (const y of [date.getFullYear() - 1, date.getFullYear(), date.getFullYear() + 1]) {
    const pk = new Date(y, sh.m - 1, sh.d, 3); const dd = (date - pk)/86400000;
    if (Math.abs(dd) < Math.abs(best)) { best = dd; peak = pk; }
  }
  return { days: best, a: Math.exp(-best*best/(2*2.4*2.4)), peak };
}
function nextPeak(sh, date) { for (const y of [date.getFullYear(), date.getFullYear() + 1]) { const pk = new Date(y, sh.m - 1, sh.d, 3); if (pk > date) return pk; } }
let meteors = [];
function spawnMeteor(sh) {
  let s, dir;
  if (sh) {
    const rad = mul(M, sh.v), ang = (12 + Math.random()*45)*D2R, ph = Math.random()*Math.PI*2;
    const t1 = nrm3(crs3(rad, Math.abs(rad[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0])), t2 = crs3(rad, t1);
    const off = comb(t1, Math.cos(ph), t2, Math.sin(ph));
    s = nrm3(comb(rad, Math.cos(ang), off, Math.sin(ang))); dir = nrm3(comb(off, Math.cos(ang), rad, -Math.sin(ang)));
  } else {
    const az = Math.random()*Math.PI*2, al = (18 + Math.random()*60)*D2R;
    s = [Math.sin(az)*Math.cos(al), Math.cos(az)*Math.cos(al), Math.sin(al)];
    const t1 = nrm3(crs3(s, [0, 0, 1])), t2 = crs3(s, t1), ph = Math.random()*Math.PI*2;
    dir = comb(t1, Math.cos(ph), t2, Math.sin(ph));
  }
  if (s[2] < 0.05) return;
  soundMeteor();
  meteors.push({ s, dir, len: (5 + Math.random()*18)*D2R, dur: 0.45 + Math.random()*0.8, t: 0, b: 0.55 + Math.random()*0.7, warm: Math.random() < 0.3 });
}
function updateMeteors(dt) {
  meteors.forEach(m => m.t += dt); meteors = meteors.filter(m => m.t < m.dur);
  if (!SET.meteors || dayReal > 0.35 || S.speed !== 1 || trails.on) return;
  let rate = 1/28;
  const act = [];
  SHOWERS.forEach(sh => { const a = showerAct(sh, now); if (a.a > 0.02 && mul(M, sh.v)[2] > -0.05) { const r = a.a*sh.zhr/60*0.5 + a.a*0.12; act.push([sh, r]); rate += r; } });
  if (Math.random() < rate*dt) {
    let pick = Math.random()*rate, chosen = null;
    for (const [sh, r] of act) { if (pick < r) { chosen = sh; break; } pick -= r; }
    spawnMeteor(chosen);
  }
}
function drawMeteors() {
  if (!meteors.length) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  meteors.forEach(m => {
    const k = m.t/m.dur, head = m.len*(1 - Math.pow(1 - k, 2)), tail = Math.max(0, head - m.len*0.45);
    const at = a => nrm3(comb(m.s, Math.cos(a), m.dir, Math.sin(a)));
    const ph = proj(at(head)), pt = proj(at(tail)); if (!ph || !pt) return;
    const fade = Math.sin(Math.PI*Math.min(1, k*1.15))*m.b;
    const g = ctx.createLinearGradient(pt[0], pt[1], ph[0], ph[1]);
    g.addColorStop(0, 'rgba(180,210,255,0)'); g.addColorStop(1, m.warm ? 'rgba(255,225,170,' + fade + ')' : 'rgba(225,240,255,' + fade + ')');
    ctx.strokeStyle = g; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(pt[0], pt[1]); ctx.lineTo(ph[0], ph[1]); ctx.stroke();
    const hg = ctx.createRadialGradient(ph[0], ph[1], 0, ph[0], ph[1], 6); hg.addColorStop(0, 'rgba(255,255,255,' + fade + ')'); hg.addColorStop(1, 'rgba(200,220,255,0)');
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(ph[0], ph[1], 6, 0, Math.PI*2); ctx.fill();
  });
  ctx.restore();
}
function drawRadiants(night) {
  SHOWERS.forEach(sh => {
    const a = showerAct(sh, now); if (a.a < 0.06) return;
    const e = mul(M, sh.v); if (!visible(e)) return;
    const p = proj(e); if (!p) return;
    ctx.save(); ctx.translate(p[0], p[1]); ctx.strokeStyle = 'rgba(140,220,255,' + (0.35 + 0.5*a.a)*night + ')'; ctx.lineWidth = 1.2;
    for (let i = 0; i < 8; i++) { const an = i*Math.PI/4; ctx.beginPath(); ctx.moveTo(Math.cos(an)*7, Math.sin(an)*7); ctx.lineTo(Math.cos(an)*(14 + (i % 2)*6), Math.sin(an)*(14 + (i % 2)*6)); ctx.stroke(); }
    ctx.restore();
    label(sh.n + (Math.abs(a.days) < 1 ? T(' · zirvede') : ''), p[0] + 18, p[1] + 4, '600 11.5px Manrope, sans-serif', 'rgba(140,220,255,' + (0.9*night + 0.1) + ')', { force: true });
    picks.push({ x: p[0], y: p[1], r: 22, pri: 1, obj: { kind: 'shower', ref: sh, v: sh.v } });

const trc = $('tr'), tctx = trc.getContext('2d');
const trails = { on: false, key: '', prevSpeed: 1 };
function setTrails(on) {

  if (on) { trails.prevSpeed = S.speed; S.speed = 900; toast(T('Uzun pozlama: yıldızlar gökyüzünün dönüşüyle iz bırakıyor. Kutup Yıldızı\'na bakarsan iç içe daireler görürsün.')); }

function drawTrails() {
  if (!trails.on) return;
  if (trc.width !== glc.width || trc.height !== glc.height) { trc.width = glc.width; trc.height = glc.height; }
  const key = [S.az.toFixed(4), S.alt.toFixed(4), S.fov.toFixed(4), W, H].join();
  tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (key !== trails.key) { tctx.clearRect(0, 0, W, H); trails.key = key; }
  tctx.globalCompositeOperation = 'lighter';
  const lim = Math.min(4.6, magLimit(S.fov*R2D) - 1);
  for (const s of STARS) {
    if (s.mag > lim) break;
    const e = mul(M, s.v); if (e[2] < 0 && SET.ground === 'solid') continue;
    const p = proj(e); if (!p || p[0] < 0 || p[0] > W || p[1] < 0 || p[1] > H) continue;
    const v = Math.max(0.08, Math.min(1, (lim - s.mag)/(lim + 1.5)));
    tctx.fillStyle = 'rgba(' + Math.round(s.rgb[0]*255) + ',' + Math.round(s.rgb[1]*255) + ',' + Math.round(s.rgb[2]*255) + ',' + (0.10 + 0.5*v).toFixed(3) + ')';
    tctx.fillRect(p[0] - 0.6 - v*0.6, p[1] - 0.6 - v*0.6, 1.2 + v*1.2, 1.2 + v*1.2);
  }
}

/* ---------------- tonight & upcoming events ---------------- */
const hm = d => d.toLocaleTimeString(LOCALE, { hour: '2-digit', minute: '2-digit' });
const dayHm = d => d.toLocaleString(LOCALE, { weekday: 'short', hour: '2-digit', minute: '2-digit' });
const dateTxt = d => d.toLocaleDateString(LOCALE, { day: 'numeric', month: 'long', year: 'numeric' });
function rs(body, dir, from, days = 1.5, alt) {
  try { const r = alt == null ? A.SearchRiseSet(body, observer, dir, from, days) : A.SearchAltitude(body, observer, dir, from, days, alt); return r ? r.date : null; } catch (e) { return null; }
}
function upcomingEvents() {
  const ev = [], t0 = atime, nowD = now, end = nowD.getTime() + 400*86400000;
  const add = (d, t, sub, act) => { if (d && d > nowD && d.getTime() < end) ev.push({ d, t, sub, act }); };
  try { let t = t0; for (let i = 0; i < 3; i++) { const fm = A.SearchMoonPhase(180, t, 40); if (!fm) break; add(fm.date, T('Dolunay'), T('Gece boyu gökte'), { body: 'Moon' }); t = fm.AddDays(1); } } catch (e) {}
  try { let t = t0; for (let i = 0; i < 2; i++) { const nm = A.SearchMoonPhase(0, t, 40); if (!nm) break; add(nm.date, T('Yeni Ay'), T('Derin gök gözlemi için en karanlık geceler'), null); t = nm.AddDays(1); } } catch (e) {}
  try { for (const y of [nowD.getFullYear(), nowD.getFullYear() + 1]) { const ss = A.Seasons(y);
    add(ss.mar_equinox.date, T('İlkbahar ekinoksu'), T('Gece ile gündüz eşit'), null); add(ss.jun_solstice.date, T('Yaz gündönümü'), T('Yılın en uzun günü'), null);
    add(ss.sep_equinox.date, T('Sonbahar ekinoksu'), T('Gece ile gündüz eşit'), null); add(ss.dec_solstice.date, T('Kış gündönümü'), T('Yılın en uzun gecesi'), null); } } catch (e) {}
  const LK = { penumbral: T('Yarıgölge'), partial: T('Parçalı'), total: LANG === 'en' ? 'Total' : 'Tam', annular: T('Halkalı') };
  try { let le = A.SearchLunarEclipse(t0); for (let i = 0; i < 3 && le; i++) {
      const eq = A.Equator('Moon', le.peak, observer, true, true), hz = A.Horizon(le.peak, observer, eq.ra, eq.dec, 'normal');
      add(le.peak.date, (LK[le.kind] || '') + T(' Ay tutulması'), hz.altitude > 0 ? S.loc.name + T('\'dan görünür') : T('Buradan görünmez (Ay ufkun altında)'), { body: 'Moon' });
      le = A.NextLunarEclipse(le.peak); } } catch (e) {}
  try { let se = A.SearchLocalSolarEclipse(t0, observer); for (let i = 0; i < 2 && se; i++) {
      add(se.peak.time.date, (LK[se.kind] || '') + T(' Güneş tutulması'), S.loc.name + T('\'dan görünür · koruyucu gözlük şart'), { body: 'Sun' });
      se = A.NextLocalSolarEclipse(se.peak.time, observer); } } catch (e) {}
  try { let ge = A.SearchGlobalSolarEclipse(t0); for (let i = 0; i < 4 && ge; i++) {
      const same = ev.find(x => x.act && x.act.body === 'Sun' && Math.abs(x.d - ge.peak.date) < 86400000);

  applyEpoch(false);
  $('timeTxt').textContent = (Math.abs(now.getUTCFullYear() - new Date().getUTCFullYear()) > 0 ? yearLabel(now.getUTCFullYear()) + ' · ' + now.toLocaleString(LOCALE, { day: 'numeric', month: 'short' }) : now.toLocaleString(LOCALE, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })) + (S.speed > 1 ? ' ▸' + S.speed + '×' : S.offset !== 0 && Math.abs(S.offset) > 60000 ? ' •' : '');
  if (nowT - lastChips > 5000 || (S.speed > 1 && nowT - lastChips > 600)) { lastChips = nowT; buildChips(); }
  if (S.sel && sheetMode === 'info' && nowT - lastInfo > (S.speed > 1 ? 400 : 3000)) { lastInfo = nowT; refreshPos(); }
  requestAnimationFrame(frame);
}
function refreshPos() {
  // update only the live position rows to avoid rebuilding the sheet under the user's finger
  const e = selE(S.sel); if (!e) return;
  const [altT, azT] = altAzTxt(e);
  const vs = sheet.querySelectorAll('.row'); vs.forEach(r => { const k = r.querySelector('.k'); if (!k) return;
    if (k.textContent === T('Yükseklik')) { r.querySelector('.v').textContent = altT; const n = r.querySelector('.n'); if (n) n.textContent = e[2] >= 0 ? T('ufkun üstünde') : T('ufkun altında'); }
    if (k.textContent === T('Yön')) r.querySelector('.v').textContent = azT; });
}

$('locName').textContent = S.loc.name;
updateAstro(true); updateCam(); buildChips();
let autoNight = null;
applyFolk();
if (LINK) { if (LINK.loc) setLoc(LINK.loc, true); if (LINK.t) S.offset = LINK.t - Date.now(); updateAstro(true); buildChips(); }
// open facing the brightest stretch of the Milky Way that is well up, else the brightest planet, else south
function bestView() {
  const GNP = [-0.8676, -0.1981, 0.4560], GC = [-0.0549, -0.8734, -0.4838], U2 = crs3(GNP, GC);
  let best = null;
  for (let l = 0; l < 360; l += 5) {
    const c = Math.cos(l*D2R), sn = Math.sin(l*D2R), e = mul(M, [GC[0]*c + U2[0]*sn, GC[1]*c + U2[1]*sn, GC[2]*c + U2[2]*sn]);
    const alt = Math.asin(e[2])*R2D; if (alt < 18 || alt > 72) continue;
    const score = alt*0.6 + Math.max(0, c)*40 + 10;
    if (!best || score > best.score) best = { score, e };
  }
  return best;
}
const showcase = bodies.filter(b => b.b !== 'Sun' && b.e[2] > 0.15 && b.mag < 1).sort((a, b) => a.mag - b.mag)[0];
let tAz = S.az, tAlt = S.alt;
const HOME = { fov: 96*D2R };
const bv = bestView();
if (bv) { const l = lookAtE(bv.e); tAz = l.az; tAlt = Math.min(Math.max(l.alt - 6*D2R, 22*D2R), 55*D2R); }
else if (showcase) { const l = lookAtE(showcase.e); tAz = l.az; tAlt = Math.min(l.alt + 8*D2R, 60*D2R); }
$('introSub').textContent = S.loc.name + (autoNight ? T(' · bu gece ') + hm(autoNight) : T(' · şu anki gerçek gökyüzü'));
if (autoNight) setTimeout(() => toast(T('Şu an gökyüzü aydınlık; sana bu gecenin karanlık gökyüzünü gösteriyorum.')), 4200);
HOME.az = tAz; HOME.alt = tAlt;
if (matchMedia('(prefers-reduced-motion: reduce)').matches) { S.az = tAz; S.alt = tAlt; }
else { S.az = tAz - 0.9; S.alt = 86*D2R; S.fov = 118*D2R; S.fly = { t: 0, az0: S.az, alt0: S.alt, fov0: S.fov, daz: 0.9, alt1: tAlt, fov1: 96*D2R, dur: 4.6 }; }
if (LINK && LINK.az != null && !isNaN(LINK.az)) { const fa = LINK.az, fl = isNaN(LINK.alt) ? 30*D2R : LINK.alt, ff = LINK.fov && !isNaN(LINK.fov) ? LINK.fov : 96*D2R; HOME.az = fa; HOME.alt = fl; HOME.fov = ff; let daz = fa - S.az; daz = Math.atan2(Math.sin(daz), Math.cos(daz)); S.fly = { t: 0, az0: S.az, alt0: S.alt, fov0: S.fov, daz, alt1: fl, fov1: ff, dur: 4.2 }; }
/* return-to-start view */
const homeBtn = $('homeBtn');
function goHome() {
  if (tour.on) endTour(); if (trails.on) setTrails(false); S.track = null; closeSheet();
  let daz = HOME.az - S.az; daz = Math.atan2(Math.sin(daz), Math.cos(daz));
  S.fly = { t: 0, az0: S.az, alt0: S.alt, fov0: S.fov, daz, alt1: HOME.alt, fov1: HOME.fov, dur: 1.8 };
}
homeBtn.addEventListener('click', goHome);
addEventListener('keydown', e => { if ((e.key === 'h' || e.key === 'H') && e.target.tagName !== 'INPUT') goHome(); });
function updateHome() {
  const far = S.fov < 55*D2R || S.fov > 110*D2R || Math.abs(S.alt - HOME.alt) > 35*D2R || Math.abs(Math.atan2(Math.sin(S.az - HOME.az), Math.cos(S.az - HOME.az))) > 75*D2R;
  const show = far && !S.fly && !tour.on;
  if (homeBtn.hidden === show) homeBtn.hidden = !show;
}

/* first visit: try to use the device location; the city list stays as the fallback */
if (!savedLoc && !(LINK && LINK.loc) && navigator.geolocation) {
  try {
    navigator.geolocation.getCurrentPosition(p => {
      setLoc({ name: T('Konumum'), lat: +p.coords.latitude.toFixed(3), lon: +p.coords.longitude.toFixed(3) }, true);
      toast(T('Konumun bulundu: gökyüzü bulunduğun yere göre hesaplanıyor.'));
    }, () => {}, { timeout: 8000, maximumAge: 3600000 });
  } catch (e) {}
}

/* offline support on the published site (the Claude preview cannot register workers) */
if ('serviceWorker' in navigator && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});

/* static interface text in the chosen language */
if (LANG === 'en') {
  document.title = 'Sky Atlas'; $('camTxt').textContent = 'Camera';
  const lab = { tTonight: 'Tonight', tExplore: 'Explore', tGyro: 'Point', tLayers: 'Layers', tSet: 'Settings' };
  Object.entries(lab).forEach(([id, t]) => { const el = $(id); if (el && el.lastChild) el.lastChild.textContent = t; });
  if (homeBtn.lastChild) homeBtn.lastChild.textContent = 'Back';
  const it = document.querySelector('#intro .it'); if (it) it.textContent = 'Sky Atlas';
  [['locBtn', 'Change location'], ['timeBtn', 'Change time'], ['searchBtn', 'Search'], ['play', 'Pause']].forEach(([id, t]) => { const el = $(id); if (el) el.setAttribute('aria-label', t); });
  ov.setAttribute('aria-label', 'Sky map. Drag to look around, pinch to zoom, tap an object for details.');
}

/* hub, ISS, first-run guide */
$('tExplore').addEventListener('click', openHub);
setTimeout(loadISS, 1800);
setTimeout(loadComets, 2200);
const ONB = [
  ['<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 40V20a4 4 0 0 1 8 0v14"/><path d="M30 32v-4a4 4 0 0 1 8 0v6"/><path d="M38 33a4 4 0 0 1 8 0v8c0 9-6 15-14 15s-12-5-15-11l-4-8a4 4 0 0 1 7-4l2 4"/><path d="M8 14h10M46 14h10M13 9l-5 5 5 5M51 9l5 5-5 5"/></svg>', T('Etrafa bak'), T('Ekranı parmağınla sürükle; gökyüzünün her yönüne dönebilirsin. Telefonu göğe tutmak için alttaki "Göğe tut"a bas.')],
  ['<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="28" cy="28" r="14"/><path d="M38 38l14 14M22 28h12M28 22v12"/></svg>', T('Yakınlaş'), T('İki parmakla aç-kapa ya da fare tekerleğini kullan. Yakınlaştıkça sönük yıldızlar, galaksiler ve Jupiter\'in uyduları ortaya çıkar.')],
  ['<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M32 6l5 15 16 1-12 10 4 16-13-9-13 9 4-16L11 22l16-1z"/></svg>', T('Dokun ve keşfet'), T('Bir yıldıza, gezegene ya da takımyıldıza dokun; hikâyesi açılır. Alttaki "Keşfet"te gök turu, doğduğun gecenin gökyüzü ve oyun var.')]
];
function showOnb(i) {
  const o = $('onb'), c = $('onbc'); if (i >= ONB.length) { o.hidden = true; store.set('onb', 1); return; }
  c.innerHTML = ONB[i][0] + '<h3>' + ONB[i][1] + '</h3><p>' + ONB[i][2] + '</p><div class="dots">' + ONB.map((_, k) => '<i class="' + (k === i ? 'on' : '') + '"></i>').join('') + T('</div><div class="btns"><button class="btn" id="onbSkip">Geç</button><button class="btn on" id="onbNext">') + (i === ONB.length - 1 ? T('Başla') : T('İleri')) + '</button></div>';

/* deep catalogue: ~94.000 faint stars load in the background once the sky is up */
function addDeep(D) {
  const n = D.mag.length, base = STARS.length;
  for (let k = 0; k < n; k++) {
    const s = { i: base + k, v: eqv(D.ra[k], D.dec[k]), ra: D.ra[k], dec: D.dec[k], mag: D.mag[k], ci: D.ci[k], ly: D.ly[k], sp: D.sp[k], name: D.name[k], bayer: D.bayer[k], flam: D.flam[k], con: D.con[k], lum: D.lum[k], hip: D.hip[k], hd: D.hd[k], hr: D.hr[k], gl: D.gl[k], vr: D.vr[k], rgb: bvToRgb(D.ci[k]) };

  }

}
